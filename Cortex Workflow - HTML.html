<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover lets the page paint into the notch / Dynamic Island safe areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Cortex Workflow - Fullscreen Mobile</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #000;
            overscroll-behavior: none;
            touch-action: none;
        }

        /* Bleed the embed into iOS landscape safe areas (notch / Dynamic Island) */
        iframe {
            position: fixed;
            top: calc(-1 * env(safe-area-inset-top, 0px));
            left: calc(-1 * env(safe-area-inset-left, 0px));
            width: calc(100% + env(safe-area-inset-left, 0px) + env(safe-area-inset-right, 0px));
            height: calc(100% + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px));
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe src="https://embed.figma.com/design/AJ7ww7QYQVNPW0OieNVisE/Cortex-Workflow---Published?node-id=1-2&embed-host=share&hide-ui=true&footer=false&theme=dark&t=ZMoeg9lqCsuN0VWz-1" allowfullscreen></iframe>

</body>
</html>
